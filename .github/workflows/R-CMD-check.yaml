name: R-CMD-check
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: macos-latest, r: release}
          - {os: macos-15-intel, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: windows-latest, r: devel}
    env:
      R_KEEP_PKG_SOURCE: yes
      OMP_NUM_THREADS: 2
      OPENBLAS_NUM_THREADS: 1
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true
      - name: Record actual architecture and extended precision
        shell: Rscript {0}
        run: |
          print(R.version)
          print(capabilities("long.double"))
          print(sessionInfo())
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Check published source archive
        shell: Rscript {0}
        env:
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_FORCE_SUGGESTS_: true
        run: |
          archive <- "artifacts/survlearning_0.3.4.tar.gz"
          stopifnot(file.exists(archive))
          stopifnot(read.dcf("DESCRIPTION")[1, "Version"] == "0.3.4")
          stopifnot(unname(tools::md5sum(archive)) == "13b2a845992c9154bbfbebb7eecf75ad")
          print(tools::md5sum(archive))
          rcmdcheck::rcmdcheck(path = archive,
            args = c("--no-manual", "--as-cran", "--run-donttest"),
            error_on = "warning", check_dir = "check")
          tests <- "check/survlearning.Rcheck/tests/testthat.Rout"
          stopifnot(file.exists(tests))
          cat(readLines(tests), sep = "\n")
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: check-${{ matrix.os }}-${{ matrix.r }}
          path: check
